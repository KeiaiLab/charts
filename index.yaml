  mongodb-operator:
  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: |
        - kind: security
          description: "Go toolchain 1.26.8 (builder golang:1.26.8) and dependency bumps close the open Trivy/govulncheck findings: stdlib 1.26.5 CVEs, golang.org/x/crypto 0.57.0, x/net 0.59.0, x/text 0.42.0, x/mod 0.41.0, grpc 1.83.2 (CVE-2026-84445/84304/84303; 1.84.0 is still affected), OpenTelemetry 1.45.0 (CVE-2026-81870), cel-go 0.30.0."
        - kind: security
          description: "Default MongoDB image is now mongo:9.0.2."
        - kind: security
          description: "Default exporter image is now percona/mongodb_exporter:0.53.0."
        - kind: security
          description: "Workflow hardening: every GitHub Action pinned by commit SHA, govulncheck and the catalog opm base image pinned, release/helm-publish/security-scan tokens read-only at the top level with write scopes per job, Dependabot version updates enabled."
        - kind: added
          description: "MongoDB 9.0 support. The upgrade webhook admits 8.3 -> 9.0 (9.0 starts with FCV 8.3); FCV 9.0 is committed after the upgrade validates. Other cross-major paths stay rejected."
      artifacthub.io/containsSecurityUpdates: 'true'
      artifacthub.io/crds: |
        - kind: MongoDB
          version: v1alpha1
          name: mongodbs.mongodb.keiailab.com
          displayName: MongoDB ReplicaSet
          description: Deploys and manages a MongoDB ReplicaSet cluster
        - kind: MongoDBSharded
          version: v1alpha1
          name: mongodbshardeds.mongodb.keiailab.com
          displayName: MongoDB Sharded Cluster
          description: Deploys and manages a MongoDB Sharded cluster with config servers, shards, and mongos routers
        - kind: MongoDBBackup
          version: v1alpha1
          name: mongodbbackups.mongodb.keiailab.com
          displayName: MongoDB Backup
          description: Creates and manages MongoDB backups to S3 or PVC storage
      artifacthub.io/crdsExamples: |
        - apiVersion: mongodb.keiailab.com/v1alpha1
          kind: MongoDB
          metadata:
            name: my-mongodb
            namespace: database
          spec:
            members: 3
            version:
              version: "9.0.2"
            storage:
              storageClassName: standard
              size: 10Gi
            auth:
              mechanism: SCRAM-SHA-256
              adminCredentialsSecretRef:
                name: mongodb-admin
            monitoring:
              enabled: true
        - apiVersion: mongodb.keiailab.com/v1alpha1
          kind: MongoDBSharded
          metadata:
            name: my-sharded
            namespace: database
          spec:
            version:
              version: "9.0.2"
            configServer:
              members: 3
              storage:
                size: 5Gi
            shards:
              count: 2
              membersPerShard: 3
              storage:
                size: 20Gi
            mongos:
              replicas: 2
        - apiVersion: mongodb.keiailab.com/v1alpha1
          kind: MongoDBBackup
          metadata:
            name: my-backup
            namespace: database
          spec:
            clusterRef:
              name: my-mongodb
              kind: MongoDB
            type: full
            compression: true
            storage:
              type: s3
              s3:
                bucket: mongodb-backups
                endpoint: https://s3.amazonaws.com
                credentialsRef:
                  name: s3-credentials
      artifacthub.io/images: |
        - name: mongodb-operator
          image: ghcr.io/keiailab/mongodb-operator:v1.16.10
        - name: mongodb
          image: mongo:9.0.2
          whitelisted: true
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.53.0
          whitelisted: true
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Documentation
          url: https://github.com/keiailab/mongodb-operator/blob/main/README.md
        - name: Source Code
          url: https://github.com/keiailab/mongodb-operator
        - name: MongoDB Documentation
          url: https://www.mongodb.com/docs/
        - name: Design Assets
          url: https://github.com/KeiaiLab/mongodb-operator/blob/main/docs/BRANDING.md
      artifacthub.io/maturity: stable
